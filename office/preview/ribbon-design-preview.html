<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welfarego OFFICE 26.2.8 — 모던 리본(Fluent Ribbon UI) 미리보기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif; background: #E9EEF7; color: #14213D; padding: 24px; }
    .wrap { max-width: 1140px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    .bar { background: #fff; border: 1px solid #D5DFEE; border-radius: 10px; padding: 14px 18px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .emblem { width: 40px; height: 40px; flex: none; display: inline-flex; }
    .pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 5px; background: #EEF2FB; color: #2151C8; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .seg { display: inline-flex; border: 1px solid #C9D5F2; border-radius: 7px; padding: 2px; background: #F5F7FD; }
    .seg button, .btn { border: none; background: transparent; padding: 6px 12px; border-radius: 5px; font-size: 12px; font-weight: 700; cursor: pointer; color: #475569; text-decoration: none; }
    .btn { border: 1px solid #C9D5F2; background: #fff; color: #14213D; }
    .window { border-radius: 10px; overflow: hidden; border: 1px solid #CBD5E1; box-shadow: 0 14px 36px rgba(20,33,61,0.12); }
    .titlebar { height: 34px; padding: 0 12px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; border-bottom: 1px solid #D5DFEE; }
    .title-left { display: flex; align-items: center; gap: 8px; font-weight: 700; }
    .menubar { padding: 4px 12px; display: flex; flex-wrap: wrap; gap: 14px; font-size: 11.5px; border-bottom: 1px solid #D5DFEE; }
    .tabs { padding: 5px 10px 0; display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid #D5DFEE; overflow-x: auto; }
    .tab-list { display: flex; gap: 2px; }
    .tab { position: relative; padding: 7px 13px; font-size: 12px; border: 1px solid transparent; border-bottom: none; border-radius: 6px 6px 0 0; background: transparent; cursor: pointer; font-weight: 600; white-space: nowrap; }
    .tab.active { font-weight: 800; }
    .tab.active::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 0; height: 3px; border-radius: 99px; background: var(--accent); }
    .ribbon { padding: 8px 12px; display: flex; align-items: stretch; gap: 6px; min-height: 78px; border-bottom: 1px solid #D5DFEE; overflow-x: auto; }
    .rgroup { display: flex; align-items: center; gap: 4px; padding-right: 8px; border-right: 1px solid var(--bd); flex: none; }
    .rgroup:last-child { border-right: none; }
    .rbtn { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 5px 9px; font-size: 11px; font-weight: 600; border: 1px solid transparent; background: transparent; cursor: pointer; border-radius: 6px; min-width: 54px; text-decoration: none; white-space: nowrap; }
    .rbtn:hover { background: rgba(33,81,200,0.08); }
    .ic-box { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; font-size: 13px; font-weight: 800; color: #fff; }
    .canvas { padding: 26px; display: flex; justify-content: center; min-height: 250px; }
    .paper { width: 100%; max-width: 720px; padding: 32px; border-radius: 3px; box-shadow: 0 4px 16px rgba(0,0,0,0.07); }
    .status { height: 28px; padding: 0 12px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; border-top: 1px solid #D5DFEE; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <div class="brand">
        <span class="emblem" aria-hidden="true">
          <svg viewBox="0 0 36 36" width="40" height="40">
            <rect width="36" height="36" rx="8" fill="#2151C8"/>
            <path d="M7.5 17.2 18 8l10.5 9.2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10.5 16v11.5h15V16" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>
            <path d="M18 24.2c-3.4-2.2-4.6-3.6-4.6-5.1 0-1.3 1-2.2 2.2-2.2.9 0 1.9.5 2.4 1.5.5-1 1.5-1.5 2.4-1.5 1.2 0 2.2.9 2.2 2.2 0 1.5-1.2 2.9-4.6 5.1Z" fill="#fff"/>
          </svg>
        </span>
        <div>
          <div style="display:flex;align-items:center;gap:8px;">
            <strong style="font-size:15px;">Welfarego OFFICE 26.2.8</strong>
            <span class="pill">WelfaregoModern 테마 · 100% 한국어 · Fluent Ribbon UI</span>
          </div>
          <div style="font-size:12px;color:#556070;">실제 설치 화면 구성 — 상단 전체 메뉴바 + 워드/엑셀/파워포인트 친숙 리본 탭 + ★ 실무포털·서식</div>
        </div>
      </div>
      <div class="controls">
        <div class="seg">
          <button id="app-doc" onclick="setApp('doc')">Document (워드)</button>
          <button id="app-sheet" onclick="setApp('sheet')">Spreadsheet (엑셀)</button>
          <button id="app-ppt" onclick="setApp('ppt')">Presentation (PPT)</button>
        </div>
        <button class="btn" id="m-dark" onclick="S.dark=!S.dark;render()">🌙 다크 모드</button>
        <a class="btn" href="/office" style="background:#2151C8;border-color:#2151C8;color:#fff;">&larr; 무료 다운로드</a>
      </div>
    </div>

    <div class="window" id="win">
      <div class="titlebar" id="tb">
        <div class="title-left">
          <svg viewBox="0 0 36 36" width="18" height="18" aria-hidden="true">
            <rect width="36" height="36" rx="8" fill="#2151C8"/>
            <path d="M7.5 17.2 18 8l10.5 9.2" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10.5 16v11.5h15V16" fill="none" stroke="#fff" stroke-width="2.8" stroke-linejoin="round"/>
            <path d="M18 24.2c-3.4-2.2-4.6-3.6-4.6-5.1 0-1.3 1-2.2 2.2-2.2.9 0 1.9.5 2.4 1.5.5-1 1.5-1.5 2.4-1.5 1.2 0 2.2.9 2.2 2.2 0 1.5-1.2 2.9-4.6 5.1Z" fill="#fff"/>
          </svg>
          <span id="title-txt"></span>
        </div>
        <span style="opacity:.6;font-family:monospace;">─ &nbsp; □ &nbsp; ✕</span>
      </div>
      <div class="menubar" id="menubar"></div>
      <div class="tabs" id="tabbar">
        <div class="tab-list" id="tablist"></div>
        <span style="font-size:11px;padding-bottom:6px;opacity:.75;white-space:nowrap;">Sukapura SVG · WelfaregoModern</span>
      </div>
      <div class="ribbon" id="ribbon"></div>
      <div class="canvas" id="canvas">
        <div class="paper" id="paper">
          <div id="doc-badge" style="font-size:11px;font-weight:700;color:#2151C8;margin-bottom:8px;"></div>
          <h2 id="doc-h" contenteditable="true" style="margin-bottom:12px;outline:none;"></h2>
          <p id="doc-p" style="font-size:14px;line-height:1.75;opacity:.9;"></p>
        </div>
      </div>
      <div class="status" id="status">
        <span id="msg">준비 · 한국어 (대한민국)</span>
        <span>v26.2.8 · MPL-2.0</span>
      </div>
    </div>
  </div>
  <script>
    const APPS = {
      doc: {
        title: '2026_연간_운영계획서.docx — Welfarego Office Document',
        badge: 'WELFAREGO OFFICE DOCUMENT · 26.2.8',
        heading: '2026년 주·야간보호시설 연간 운영계획서',
        body: '상단 전체 메뉴바와 [파일 · 홈 · 삽입 · 디자인 · 레이아웃 · 참조 · 검토 · 보기 · ★ 실무포털·서식 · 도구] 탭을 모두 100% 한국어로 제공합니다.',
        menus: ['파일(F)', '편집(E)', '보기(V)', '삽입(I)', '서식(O)', '스타일(Y)', '표(A)', '양식(M)', '도구(T)', '실무포털·서식(W)', '창', '도움말(H)'],
        tabs: ['파일', '홈', '삽입', '디자인', '레이아웃', '참조', '검토', '보기', '★ 실무포털·서식', '도구'],
        buttons: {
          '디자인': [['🎨','문서 테마','#2151C8'], ['💧','워터마크','#0284C7'], ['📄','페이지 스타일','#2563EB'], ['▭','페이지 테두리','#4F46E5'], ['⌗','머리글/바닥글','#0D9488'], ['#','페이지 번호','#15803D']]
        }
      },
      sheet: {
        title: '2026_월간_급여_근무표.xlsx — Welfarego Office Spreadsheet',
        badge: 'WELFAREGO OFFICE SPREADSHEET · 26.2.8',
        heading: '2026년 4월 종사자 근무표 및 기준근무시간 정산',
        body: '엑셀 사용자에게 익숙한 [페이지 레이아웃]과 [수식](함수 마법사·이름 정의·참조 셀 추적·다시 계산) 탭이 기본 내장되어 있습니다.',
        menus: ['파일(F)', '편집(E)', '보기(V)', '삽입(I)', '서식(O)', '스타일(Y)', '시트(S)', '데이터(D)', '도구(T)', '실무포털·서식(W)', '창', '도움말(H)'],
        tabs: ['파일', '홈', '삽입', '페이지 레이아웃', '수식', '데이터', '검토', '보기', '★ 실무포털·서식', '도구'],
        buttons: {
          '수식': [['fx','함수 마법사','#15803D'], ['∑','수식 표시','#0D9488'], ['🏷','이름 정의','#2151C8'], ['↗','참조 셀 추적','#2563EB'], ['⟳','지금 계산','#D97706']]
        }
      },
      ppt: {
        title: '2026_운영위원회_보고자료.pptx — Welfarego Office Presentation',
        badge: 'WELFAREGO OFFICE PRESENTATION · 26.2.8',
        heading: '2026년 상반기 운영위원회 및 직원 교육 자료',
        body: '파워포인트와 유사한 [디자인 · 화면 전환 · 애니메이션 · 슬라이드 쇼] 탭을 모두 한국어로 바로 사용할 수 있습니다.',
        menus: ['파일(F)', '편집(E)', '보기(V)', '삽입(I)', '서식(O)', '슬라이드(S)', '슬라이드 쇼', '도구(T)', '실무포털·서식(W)', '창', '도움말(H)'],
        tabs: ['파일', '홈', '삽입', '디자인', '화면 전환', '애니메이션', '슬라이드 쇼', '검토', '보기', '★ 실무포털·서식', '도구'],
        buttons: {
          '화면 전환': [['✨','화면 전환 창','#C2410C'], ['▶','현재 슬라이드','#2151C8'], ['⏱','시간 예행연습','#0D9488'], ['▦','여러 슬라이드','#4F46E5']],
          '애니메이션': [['★','애니메이션 창','#D97706'], ['▶','미리보기','#2151C8'], ['A','텍스트 상자','#2563EB'], ['◆','기본 도형','#15803D']]
        }
      }
    };
    const WG_LINKS = [
      { lbl: '표준서식 20종', href: '/go/forms', bg: '#2151C8', sym: '📄' },
      { lbl: '기준근무시간', href: '/go/worktime', bg: '#0D9488', sym: '⏱' },
      { lbl: '2026 표준수가', href: '/go/fees', bg: '#15803D', sym: '₩' },
      { lbl: '본인부담·달력', href: '/go/calendar', bg: '#D97706', sym: '📅' },
      { lbl: '평가 자가점검', href: '/go/checklist', bg: '#DC2626', sym: '✓' }
    ];
    const S = { app: 'doc', dark: false, tab: '홈' };
    function setApp(k) { S.app = k; S.tab = '홈'; render(); }
    function render() {
      const a = APPS[S.app];
      const p = S.dark
        ? { h:'#151C2C', b:'#1E293B', bd:'#334155', cv:'#0F172A', tx:'#E2E8F0', ac:'#60A5FA', pp:'#1E293B', pt:'#F1F5F9' }
        : { h:'#EEF2FB', b:'#FFFFFF', bd:'#D5DFEE', cv:'#E9EEF7', tx:'#14213D', ac:'#2151C8', pp:'#FFFFFF', pt:'#14213D' };
      ['doc','sheet','ppt'].forEach(k => {
        document.getElementById('app-' + k).style.cssText = S.app === k ? 'background:#2151C8;color:#fff' : '';
      });
      document.getElementById('m-dark').textContent = S.dark ? '☀️ 라이트 모드' : '🌙 다크 모드';
      const w = document.getElementById('win');
      w.style.setProperty('--accent', p.ac); w.style.setProperty('--bd', p.bd); w.style.borderColor = p.bd;
      ['tb','menubar','tabbar','status'].forEach(id => { const el = document.getElementById(id); el.style.background = p.h; el.style.borderColor = p.bd; el.style.color = p.tx; });
      document.getElementById('title-txt').textContent = a.title;
      document.getElementById('menubar').innerHTML = a.menus.map(m => `<span>${m}</span>`).join('');
      document.getElementById('tablist').innerHTML = a.tabs.map(t => {
        const active = S.tab === t;
        const star = t.startsWith('★');
        return `<button class="tab ${active?'active':''}" onclick="S.tab='${t}';render()" style="background:${active?p.b:'transparent'};color:${active?p.ac:(star?p.ac:p.tx)};border-color:${active?p.bd:'transparent'};">${t}</button>`;
      }).join('');
      const rb = document.getElementById('ribbon');
      rb.style.background = p.b; rb.style.borderColor = p.bd;
      const wgHtml = WG_LINKS.map(x => `<a class="rbtn" href="${x.href}" target="_blank" rel="noopener noreferrer" style="color:${p.tx};"><span class="ic-box" style="background:${x.bg};">${x.sym}</span><span>${x.lbl}</span></a>`).join('');
      if (S.tab === '★ 실무포털·서식') {
        rb.innerHTML = `<div class="rgroup">${wgHtml}</div>`;
      } else if (a.buttons[S.tab]) {
        rb.innerHTML = `<div class="rgroup">${a.buttons[S.tab].map(([ic,lbl,bg]) => `<button class="rbtn" style="color:${p.tx};"><span class="ic-box" style="background:${bg};">${ic}</span><span>${lbl}</span></button>`).join('')}</div>`;
      } else {
        rb.innerHTML = `
          <div class="rgroup">
            <button class="rbtn" style="color:${p.tx};"><span class="ic-box" style="background:#3B82F6;">📋</span><span>붙여넣기</span></button>
            <button class="rbtn" style="color:${p.tx};"><span class="ic-box" style="background:#2151C8;">💾</span><span>저장</span></button>
            <button class="rbtn" style="color:${p.tx};"><span class="ic-box" style="background:#E11D48;">PDF</span><span>PDF 바로 저장</span></button>
          </div>
          <div class="rgroup">${wgHtml}</div>`;
      }
      document.getElementById('canvas').style.background = p.cv;
      const pp = document.getElementById('paper'); pp.style.background = p.pp; pp.style.color = p.pt;
      document.getElementById('doc-badge').textContent = a.badge;
      document.getElementById('doc-h').textContent = a.heading;
      document.getElementById('doc-p').textContent = a.body;
    }
    render();
  </script>
</body>
</html>
