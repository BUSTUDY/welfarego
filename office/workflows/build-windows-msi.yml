name: Build Welfarego OFFICE Windows x64 MSI

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (recommended: self-hosted Windows 16+ cores / 80GB SSD, or windows-2022)"
        required: true
        default: "windows-2022"
        type: choice
        options:
          - windows-2022
          - self-hosted
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-msi:
    runs-on: ${{ inputs.runner || 'windows-2022' }}
    timeout-minutes: 360
    steps:
      - name: Checkout Welfarego OFFICE
        uses: actions/checkout@v4

      - name: Configure fast build drive & Windows Defender
        shell: pwsh
        run: |
          if (Test-Path "D:\") {
            $workDir = "D:\lo"
          } else {
            $workDir = "C:\lo"
          }
          "LO_WORK_DIR=$workDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ("${{ runner.environment }}" -eq "github-hosted") {
            try { Set-MpPreference -DisableRealtimeMonitoring $true } catch { Write-Host "Defender skip: $_" }
          }
          Write-Host "Selected work directory: $workDir"
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{N='FreeGB';E={[math]::Round($_.Free/1GB,2)}}, @{N='UsedGB';E={[math]::Round($_.Used/1GB,2)}}

      - name: Setup Python & Pillow for compliance check
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Verify open-source compliance before build
        run: python scripts/verify_compliance.py

      - name: Install Cygwin64 build dependencies
        shell: pwsh
        run: |
          $cygRoot = "C:\cygwin64"
          $setupExe = "C:\cygwin-setup-x86_64.exe"
          if (-not (Test-Path $setupExe)) {
            Invoke-WebRequest -Uri "https://cygwin.com/setup-x86_64.exe" -OutFile $setupExe
          }
          $packages = @(
            "autoconf", "automake", "bison", "ca-certificates", "cabextract",
            "curl", "diffutils", "file", "flex", "gettext", "gettext-devel",
            "gnupg", "gperf", "m4", "nasm", "ninja", "patch", "perl",
            "perl-Archive-Zip", "perl-Font-TTF", "perl-Digest-MD5",
            "pkg-config", "pkgconf", "unzip", "wget", "which", "zip"
          ) -join ","
          Start-Process -FilePath $setupExe -Wait -ArgumentList @(
            "--quiet-mode",
            "--no-shortcuts",
            "--no-desktop",
            "--root", $cygRoot,
            "--site", "https://mirrors.kernel.org/sourceware/cygwin/",
            "--packages", $packages
          )

          # Install LibreOffice's official MSVC-compatible GNU make, pkgconf-2.4.3.exe, and jom.exe into /usr/local/bin
          $localBin = Join-Path $cygRoot "usr\local\bin"
          New-Item -ItemType Directory -Force -Path $localBin | Out-Null

          $makePath = Join-Path $localBin "make.exe"
          Invoke-WebRequest -Uri "https://dev-www.libreoffice.org/bin/cygwin/make-4.2.1-msvc.exe" -OutFile $makePath
          if ((Get-FileHash $makePath -Algorithm SHA256).Hash.ToLower() -ne "146d6f2b0ea57647b11b506a95048a7be73232e1feeeccbc1013651f992423d8") {
            throw "SHA256 mismatch for make-4.2.1-msvc.exe"
          }

          $pkgPath = Join-Path $localBin "pkgconf-2.4.3.exe"
          Invoke-WebRequest -Uri "https://dev-www.libreoffice.org/extern/pkgconf-2.4.3.exe" -OutFile $pkgPath
          if ((Get-FileHash $pkgPath -Algorithm SHA256).Hash.ToLower() -ne "791cd6dbc56f7268fbf9c4652d6634b0f5c59687ab4e504565e58245952edd41") {
            throw "SHA256 mismatch for pkgconf-2.4.3.exe"
          }

          $jomZip = "C:\jom_1_1_4.zip"
          Invoke-WebRequest -Uri "https://download.qt.io/official_releases/jom/jom_1_1_4.zip" -OutFile $jomZip
          if ((Get-FileHash $jomZip -Algorithm SHA256).Hash.ToLower() -ne "d533c1ef49214229681e90196ed2094691e8c4a0a0bef0b2c901debcb562682b") {
            throw "SHA256 mismatch for jom_1_1_4.zip"
          }
          Expand-Archive -Path $jomZip -DestinationPath "C:\jom_tmp" -Force
          Copy-Item -Path "C:\jom_tmp\jom.exe" -Destination (Join-Path $localBin "jom.exe") -Force
          Remove-Item -Recurse -Force "C:\jom_tmp", $jomZip

      - name: Cache LibreOffice external source tarballs
        uses: actions/cache@v4
        with:
          path: ${{ env.LO_WORK_DIR }}\ext-tar
          key: lo-ext-tar-26.2.7.3-${{ hashFiles('config/windows-x64.autogen.input') }}
          restore-keys: |
            lo-ext-tar-26.2.7.3-

      - name: Build Welfarego OFFICE Windows x64 MSI
        shell: pwsh
        run: .\scripts\build-windows.ps1 -WorkDir "$env:LO_WORK_DIR" -CygwinRoot C:\cygwin64

      - name: Upload Setup EXE, MSI Installer & MPL-2.0 Source Archive
        uses: actions/upload-artifact@v4
        with:
          name: Welfarego-OFFICE-Windows-x64-Installer
          path: |
            dist/*.exe
            dist/*.msi
            dist/*_MPL2_Source_Patches.zip
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.msi
            dist/*_MPL2_Source_Patches.zip
            dist/SHA256SUMS.txt
          body: |
            ## Welfarego OFFICE (Windows x64 Setup `.exe` & `.msi`)

            - **원클릭 Windows 설치 파일**: `WelfaregoOFFICE_26.2.7.3_Setup_x64.exe` (한국어/영문 설치 마법사)
            - **Modern Fluent Ribbon UI** 기본 적용 (Writer, Calc, Impress, Draw)
            - **Sukapura SVG** 모던 벡터 아이콘 + 한국어(`ko`) / 영문(`en-US`) UI
            - **순수 MPL-2.0 서브셋 빌드** (`--enable-mpl-subset`): GPL/LGPL 전용 모듈 배제
            - **MPL-2.0 소스 공개**: `*_MPL2_Source_Patches.zip` 동봉
