name: Build Welfarego OFFICE Bundle EXE

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Welfarego OFFICE release version (e.g. 26.2.9)"
        required: true
        default: "26.2.9"
        type: string
      release_tag:
        description: "GitHub Release tag to publish (e.g. v26.2.9)"
        required: true
        default: "v26.2.9"
        type: string
      lo_version:
        description: "Upstream LibreOffice Windows x64 MSI version (e.g. 26.2.7)"
        required: true
        default: "26.2.7"
        type: string

permissions:
  contents: write

jobs:
  build-bundle-exe:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout welfarego
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate portal-matched branding, rebuild .oxt & verify compliance
        run: |
          python -m pip install --upgrade pillow
          python office/scripts/generate_branding.py
          python office/scripts/build_extension.py
          python office/scripts/verify_compliance.py

      - name: Download official LibreOffice Windows x64 MSI & verify SHA256
        shell: pwsh
        run: |
          $loVer = "${{ inputs.lo_version }}"
          $distDir = Join-Path $PWD "office\dist"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          $msiName = "LibreOffice_${loVer}_Win_x86-64.msi"
          $msiPath = Join-Path $distDir $msiName
          $shaPath = Join-Path $distDir "${msiName}.sha256"

          $baseUrls = @(
            "https://download.documentfoundation.org/libreoffice/stable/${loVer}/win/x86_64",
            "https://downloadarchive.documentfoundation.org/libreoffice/old/${loVer}.2/win/x86_64",
            "https://downloadarchive.documentfoundation.org/libreoffice/old/${loVer}.3/win/x86_64"
          )

          $downloaded = $false
          foreach ($base in $baseUrls) {
            try {
              Write-Host "Trying $base/$msiName ..." -ForegroundColor Cyan
              & curl.exe -fsSL --retry 3 -o $msiPath "$base/$msiName"
              if ($LASTEXITCODE -eq 0 -and (Test-Path $msiPath) -and (Get-Item $msiPath).Length -gt 100MB) {
                $downloaded = $true
                & curl.exe -fsSL --retry 2 -o $shaPath "$base/${msiName}.sha256"
                break
              }
            } catch {
              Write-Host "Mirror attempt failed: $_" -ForegroundColor Yellow
            }
          }

          if (-not $downloaded) {
            throw "Failed to download $msiName from official Document Foundation mirrors."
          }

          $actualHash = (Get-FileHash -Path $msiPath -Algorithm SHA256).Hash.ToLower()
          Write-Host "Downloaded $msiName ($([math]::Round((Get-Item $msiPath).Length / 1MB, 1)) MB), SHA256=$actualHash"
          if (Test-Path $shaPath) {
            $expectedLine = (Get-Content -Path $shaPath -Raw).Trim()
            if ($expectedLine -match "([0-9a-fA-F]{64})") {
              $expectedHash = $Matches[1].ToLower()
              if ($actualHash -ne $expectedHash) {
                throw "SHA256 mismatch! expected=$expectedHash actual=$actualHash"
              }
              Write-Host "[OK] Official SHA256 verified." -ForegroundColor Green
            }
          }
          "LO_MSI_PATH=$msiPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile one-click Setup .exe & Source Archive with Inno Setup 6
        shell: pwsh
        run: |
          $appVer = "${{ inputs.app_version }}"
          $officeRoot = Join-Path $PWD "office"
          $distDir = Join-Path $officeRoot "dist"
          $issFile = Join-Path $officeRoot "installer\WelfaregoOFFICE-Bundle.iss"

          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found." }

          $utf8Bom = New-Object System.Text.UTF8Encoding($true)
          foreach ($f in @(
            (Join-Path $officeRoot "installer\Korean.isl"),
            (Join-Path $officeRoot "installer\configure-installed-office.ps1"),
            (Join-Path $officeRoot "installer\uninstall-welfarego-office.ps1")
          )) {
            $txt = Get-Content -Path $f -Raw -Encoding UTF8
            [System.IO.File]::WriteAllText($f, $txt, $utf8Bom)
          }

          $licKo = Join-Path $officeRoot "legal\INSTALLER-LICENSE-KO.txt"
          $licText = (Get-Content -Path $licKo -Raw -Encoding UTF8) -replace "`r?`n", "`r`n"
          [System.IO.File]::WriteAllText($licKo, $licText, $utf8Bom)

          & $iscc `
            "/DAppVersion=$appVer" `
            "/DMsiFile=$env:LO_MSI_PATH" `
            "/DOutputDirPath=$distDir" `
            "/DDryRun=0" `
            $issFile
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with code $LASTEXITCODE" }

          $exePath = Join-Path $distDir "WelfaregoOFFICE_${appVer}_Setup_x64.exe"
          if (-not (Test-Path $exePath)) { throw "Expected EXE not found at $exePath" }

          $oxtOut = Join-Path $distDir "Welfarego_Office_Shortcuts_${appVer}.oxt"
          Copy-Item -Path (Join-Path $officeRoot "extensions\welfarego-links.oxt") -Destination $oxtOut -Force

          # Package complete Welfarego OFFICE corresponding source archive (MPL-2.0 §3.2 / LGPLv3 §4)
          $srcZipPath = Join-Path $distDir "WelfaregoOFFICE_${appVer}_Source.zip"
          python (Join-Path $officeRoot "scripts\package_source_zip.py") --version $appVer --output $srcZipPath
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $srcZipPath)) { throw "Failed to build Source ZIP at $srcZipPath" }

          $hashFiles = @(
            $exePath,
            $oxtOut,
            $srcZipPath
          )
          $sums = foreach ($f in $hashFiles) {
            $h = (Get-FileHash -Path $f -Algorithm SHA256).Hash.ToLower()
            "$h  $(Split-Path $f -Leaf)"
          }
          Set-Content -Path (Join-Path $distDir "SHA256SUMS.txt") -Value $sums -Encoding UTF8
          Get-ChildItem $distDir | Format-Table Name, Length
          "BUILT_EXE_PATH=$exePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: End-to-End Install & Verify Welfarego OFFICE on Windows
        shell: pwsh
        run: |
          $appVer = "${{ inputs.app_version }}"
          Write-Host "Running silent install of $env:BUILT_EXE_PATH ..." -ForegroundColor Cyan
          $proc = Start-Process -FilePath $env:BUILT_EXE_PATH -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "Installer exited with code $($proc.ExitCode)"
          }

          $loDir = "C:\Program Files\LibreOffice"
          $instLog = Join-Path $loDir "welfarego-install.log"
          if (Test-Path $instLog) {
            Write-Host "=== welfarego-install.log ===" -ForegroundColor Cyan
            Get-Content -Path $instLog -Encoding UTF8 | Write-Host
          }

          # Verify complete legal notice bundle inside C:\Program Files\LibreOffice\welfarego-legal
          $legalDir = Join-Path $loDir "welfarego-legal"
          foreach ($lf in @("LICENSE", "NOTICE", "PRIVACY.md", "SOURCE-OFFER.md", "THIRD-PARTY-LICENSES.md", "INSTALLER-LICENSE-KO.txt")) {
            $lp = Join-Path $legalDir $lf
            if (-not (Test-Path $lp)) { throw "Missing legal notice file in installed folder: $lp" }
          }
          Write-Host "[OK] All 6 legal notice files verified in $legalDir" -ForegroundColor Green

          $xcd = Join-Path $loDir "share\registry\zz-welfarego-defaults.xcd"
          $koXcd = Join-Path $loDir "share\registry\res\zz-welfarego-ko-labels.xcd"
          if (-not (Test-Path $xcd)) { throw "Missing zz-welfarego-defaults.xcd!" }
          if (-not (Test-Path $koXcd)) { throw "Missing res\zz-welfarego-ko-labels.xcd!" }
          $xcdText = Get-Content -Path $xcd -Raw -Encoding UTF8
          if ($xcdText -notmatch "notebookbar\.ui" -or $xcdText -notmatch "WelfaregoModern" -or $xcdText -notmatch "WhatsNew") {
            throw "zz-welfarego-defaults.xcd content verification failed!"
          }
          Write-Host "[OK] zz-welfarego-defaults.xcd & res/zz-welfarego-ko-labels.xcd verified" -ForegroundColor Green

          # Verify Korean Ribbon Tabs & New Word/Excel/PowerPoint Tabs across all 3 main apps
          foreach ($chk in @(
            @{ Mod = "swriter"; MustHave = @("WelfaregoDesignLabel", "WelfaregoHomeAddons") },
            @{ Mod = "scalc"; MustHave = @("WelfaregoFormulasLabel", "WelfaregoHomeAddons") },
            @{ Mod = "simpress"; MustHave = @("WelfaregoTransitionsLabel", "WelfaregoAnimationsLabel") }
          )) {
            $uiPath = Join-Path $loDir "share\config\soffice.cfg\modules\$($chk.Mod)\ui\notebookbar.ui"
            $uiTxt = Get-Content -Path $uiPath -Raw -Encoding UTF8
            foreach ($needle in $chk.MustHave) {
              if ($uiTxt -notmatch [regex]::Escape($needle)) {
                throw "Missing $needle in $($chk.Mod) notebookbar.ui!"
              }
            }
            if ($uiTxt -match ">~Insert<|>~Layout<|>Fiel_d<|>_Insert<") {
              throw "Untranslated English tab/button label remained in $($chk.Mod) notebookbar.ui!"
            }
          }
          Write-Host "[OK] Korean full Ribbon tabs verified (Document: Design, Spreadsheet: Page Layout + Formulas, Presentation: Design + Transitions + Animations)" -ForegroundColor Green

          $pubDesk = [Environment]::GetFolderPath("CommonDesktopDirectory")
          if (-not $pubDesk) { $pubDesk = "C:\Users\Public\Desktop" }
          if (-not (Test-Path (Join-Path $pubDesk "Welfarego OFFICE.lnk"))) { throw "Missing Desktop shortcut" }
          $commonProg = [Environment]::GetFolderPath("CommonPrograms")
          if (-not $commonProg) { $commonProg = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs" }
          foreach ($reqMenu in @(
            "Welfarego OFFICE\Welfarego OFFICE.lnk",
            "Welfarego OFFICE\Welfarego Office Document.lnk",
            "Welfarego OFFICE\Welfarego Office Spreadsheet.lnk",
            "Welfarego OFFICE\Welfarego Office Presentation.lnk",
            "Welfarego OFFICE\Welfarego Office Draw.lnk"
          )) {
            if (-not (Test-Path (Join-Path $commonProg $reqMenu))) { throw "Missing Start Menu shortcut: $reqMenu" }
          }
          Write-Host "[OK] Desktop & Start Menu shortcuts verified" -ForegroundColor Green

          # Verify Control Panel shows ONLY Welfarego OFFICE $appVer
          $visibleLo = @()
          $visibleWg = @()
          foreach ($root in @("HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall", "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall")) {
            if (-not (Test-Path $root)) { continue }
            Get-ChildItem -Path $root | ForEach-Object {
              $p = Get-ItemProperty -Path $_.PSPath -ErrorAction SilentlyContinue
              if ($null -ne $p -and $p.DisplayName -and $p.SystemComponent -ne 1) {
                if ($p.DisplayName -like "LibreOffice*") { $visibleLo += $p.DisplayName }
                if ($p.DisplayName -like "Welfarego OFFICE*") { $visibleWg += $p.DisplayName }
              }
            }
          }
          if ($visibleLo.Count -gt 0) { throw "LibreOffice is still visible in Control Panel: $($visibleLo -join ', ')" }
          if ($visibleWg.Count -eq 0) { throw "Welfarego OFFICE uninstaller missing from Control Panel!" }
          Write-Host "[OK] Control Panel shows ONLY '$($visibleWg -join ', ')'" -ForegroundColor Green

          $extListFile = Join-Path $env:TEMP "unopkg_list.txt"
          Start-Process -FilePath (Join-Path $loDir "program\unopkg.com") -ArgumentList "list --shared" -RedirectStandardOutput $extListFile -WindowStyle Hidden -Wait
          $extOut = Get-Content -Path $extListFile -Raw -Encoding UTF8
          if ($extOut -notmatch "kr\.co\.welfarego\.office\.links") {
            throw "Shared extension kr.co.welfarego.office.links was not registered!"
          }
          Write-Host "[OK] Shared extension kr.co.welfarego.office.links ($appVer) registered!" -ForegroundColor Green

          # REAL GUI launch verification across Start Center, Document, Spreadsheet, and Presentation!
          foreach ($mode in @(
            @{ Label = "Start Center"; Args = "--norestore" },
            @{ Label = "Document"; Args = "--norestore --writer" },
            @{ Label = "Spreadsheet"; Args = "--norestore --calc" },
            @{ Label = "Presentation"; Args = "--norestore --impress" }
          )) {
            Write-Host "Testing real GUI launch of soffice.exe ($($mode.Label)) ..." -ForegroundColor Cyan
            $guiErr = Join-Path $env:TEMP "gui_stderr.txt"
            $guiOut = Join-Path $env:TEMP "gui_stdout.txt"
            Remove-Item -Path $guiErr, $guiOut -Force -ErrorAction SilentlyContinue
            $guiProc = Start-Process -FilePath (Join-Path $loDir "program\soffice.exe") -ArgumentList $mode.Args -RedirectStandardError $guiErr -RedirectStandardOutput $guiOut -PassThru
            Start-Sleep -Seconds 8
            $binProcs = Get-Process -Name "soffice.bin" -ErrorAction SilentlyContinue
            if (-not $binProcs) {
              Write-Host "=== GUI stdout ($($mode.Label)) ===" -ForegroundColor Yellow
              if (Test-Path $guiOut) { Get-Content $guiOut | Write-Host }
              Write-Host "=== GUI stderr ($($mode.Label)) ===" -ForegroundColor Yellow
              if (Test-Path $guiErr) { Get-Content $guiErr | Write-Host }
              throw "GUI soffice.exe ($($mode.Label)) exited/crashed! (ExitCode=$($guiProc.ExitCode))"
            }
            Write-Host "[OK] Real GUI $($mode.Label) alive! PID=$($binProcs.Id -join ',') Title='$($binProcs.MainWindowTitle -join ', ')'" -ForegroundColor Green
            Start-Process -FilePath "taskkill.exe" -ArgumentList "/F /IM soffice.bin /IM soffice.exe /T" -WindowStyle Hidden -Wait | Out-Null
            Start-Sleep -Seconds 2
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "Welfarego OFFICE ${{ inputs.app_version }} (Windows x64 통합 설치파일)"
          overwrite_files: true
          files: |
            office/dist/WelfaregoOFFICE_${{ inputs.app_version }}_Setup_x64.exe
            office/dist/Welfarego_Office_Shortcuts_${{ inputs.app_version }}.oxt
            office/dist/WelfaregoOFFICE_${{ inputs.app_version }}_Source.zip
            office/dist/SHA256SUMS.txt
          body: |
            ## Welfarego OFFICE ${{ inputs.app_version }} (Windows 64비트 통합 설치파일)

            - **원클릭 설치파일**: `WelfaregoOFFICE_${{ inputs.app_version }}_Setup_x64.exe`
            - **수정·구성 소스코드 아카이브**: `WelfaregoOFFICE_${{ inputs.app_version }}_Source.zip`
            - **실무 바로가기 확장기능**: `Welfarego_Office_Shortcuts_${{ inputs.app_version }}.oxt`
            - **v${{ inputs.app_version }} 주요 개선 사항**:
              1. **오픈소스 법적 고지·소스코드 공개 완비 (MPL-2.0 §3.2 · LGPLv3 §4 준수)**:
                 - 설치본(`C:\Program Files\LibreOffice\welfarego-legal\`) 내 6종 법적 문서(`LICENSE`, `NOTICE`, `SOURCE-OFFER.md`, `THIRD-PARTY-LICENSES.md`, `PRIVACY.md`, `INSTALLER-LICENSE-KO.txt`) 전부 동봉
                 - 본 GitHub 릴리스 페이지에 `WelfaregoOFFICE_${{ inputs.app_version }}_Source.zip` 소스 아카이브 직접 첨부 및 SHA-256 체크섬 제공
                 - 공식 LibreOffice `${{ inputs.lo_version }}` 기반 엔진(MPL-2.0 · LGPLv3/Apache-2.0 포함) 및 상위 원본 소스 링크 정확히 명기
              2. **100% 한국어 모던 리본 UI + 워드·엑셀·파워포인트 친숙 리본 탭 & 상단 전체 메뉴바 병행 표시**
              3. **2026 WelfaregoModern 라이트 블루-화이트 테마** + Sukapura SVG 컬러 벡터 아이콘 + 제어판 `Welfarego OFFICE ${{ inputs.app_version }}` 단독 표시

            ### 오픈소스 라이선스 및 소스코드 출처 (MPL-2.0 / LGPLv3)
            - **기반 엔진**: The Document Foundation 공식 오픈소스 LibreOffice `${{ inputs.lo_version }}` (MPL-2.0 및 포함된 LGPLv3·Apache-2.0·MIT 서드파티 구성요소)
            - **웰페어고 수정·구성 소스**: 본 릴리스 첨부 `WelfaregoOFFICE_${{ inputs.app_version }}_Source.zip`, [GitHub 저장소](https://github.com/BUSTUDY/welfarego), 또는 https://welfarego.co.kr/office/download/mpl2-source.zip
            - **상위 원본 LibreOffice `${{ inputs.lo_version }}` 소스**: https://download.documentfoundation.org/libreoffice/src/${{ inputs.lo_version }}/
            - **상표 고지**: "LibreOffice" 및 "The Document Foundation"은 The Document Foundation(TDF)의 등록상표이며, Welfarego OFFICE는 독립적인 파생 배포판입니다.
