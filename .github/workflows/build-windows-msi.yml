name: Build Welfarego OFFICE Windows x64 MSI

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (recommended: self-hosted Windows 16+ cores / 80GB SSD, or windows-2022)"
        required: true
        default: "windows-2022"
        type: choice
        options:
          - windows-2022
          - self-hosted
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-msi:
    runs-on: ${{ inputs.runner || 'windows-2022' }}
    timeout-minutes: 360
    steps:
      - name: Checkout Welfarego OFFICE
        uses: actions/checkout@v4

      - name: Free disk space on GitHub-hosted Windows runner
        if: runner.environment == 'github-hosted'
        shell: pwsh
        run: |
          Write-Host "Disk space BEFORE cleanup:"
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{N='FreeGB';E={[math]::Round($_.Free/1GB,2)}}, @{N='UsedGB';E={[math]::Round($_.Used/1GB,2)}}
          $paths = @(
            "C:\Android",
            "C:\ghcup",
            "C:\hostedtoolcache\windows\CodeQL",
            "C:\Program Files\Microsoft SDKs\Azure",
            "C:\Program Files (x86)\Android",
            "C:\ProgramData\Chocolatey\lib"
          )
          $procs = @()
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "Fast-removing $p..."
              $procs += Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "rmdir /s /q `"$p`"" -PassThru -NoNewWindow
            }
          }
          if ($procs.Count -gt 0) {
            $procs | Wait-Process
          }
          Write-Host "Disk space AFTER cleanup:"
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{N='FreeGB';E={[math]::Round($_.Free/1GB,2)}}, @{N='UsedGB';E={[math]::Round($_.Used/1GB,2)}}

      - name: Setup Python & Pillow for compliance check
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Verify open-source compliance before build
        run: python scripts/verify_compliance.py

      - name: Install Cygwin64 build dependencies
        shell: pwsh
        run: |
          $cygRoot = "C:\cygwin64"
          $setupExe = "C:\cygwin-setup-x86_64.exe"
          if (-not (Test-Path $setupExe)) {
            Invoke-WebRequest -Uri "https://cygwin.com/setup-x86_64.exe" -OutFile $setupExe
          }
          $packages = @(
            "autoconf", "automake", "bison", "ca-certificates", "cabextract",
            "curl", "diffutils", "file", "flex", "gettext", "gettext-devel",
            "gnupg", "gperf", "m4", "nasm", "patch", "perl", "perl-Archive-Zip",
            "perl-Font-TTF", "perl-Digest-MD5", "unzip", "wget", "which", "zip"
          ) -join ","
          Start-Process -FilePath $setupExe -Wait -ArgumentList @(
            "--quiet-mode",
            "--no-shortcuts",
            "--no-desktop",
            "--root", $cygRoot,
            "--site", "https://mirrors.kernel.org/sourceware/cygwin/",
            "--packages", $packages
          )

          # Install LibreOffice's official MSVC-compatible GNU make and pkgconf into /usr/local/bin
          $localBin = Join-Path $cygRoot "usr\local\bin"
          New-Item -ItemType Directory -Force -Path $localBin | Out-Null

          $makePath = Join-Path $localBin "make.exe"
          Invoke-WebRequest -Uri "https://dev-www.libreoffice.org/bin/cygwin/make-4.2.1-msvc.exe" -OutFile $makePath
          if ((Get-FileHash $makePath -Algorithm SHA256).Hash.ToLower() -ne "146d6f2b0ea57647b11b506a95048a7be73232e1feeeccbc1013651f992423d8") {
            throw "SHA256 mismatch for make-4.2.1-msvc.exe"
          }

          $pkgPath = Join-Path $localBin "pkgconf.exe"
          Invoke-WebRequest -Uri "https://dev-www.libreoffice.org/extern/pkgconf-2.4.3.exe" -OutFile $pkgPath
          if ((Get-FileHash $pkgPath -Algorithm SHA256).Hash.ToLower() -ne "791cd6dbc56f7268fbf9c4652d6634b0f5c59687ab4e504565e58245952edd41") {
            throw "SHA256 mismatch for pkgconf-2.4.3.exe"
          }

      - name: Cache LibreOffice external source tarballs
        uses: actions/cache@v4
        with:
          path: C:\lo\ext-tar
          key: lo-ext-tar-26.2.7.3-${{ hashFiles('config/windows-x64.autogen.input') }}
          restore-keys: |
            lo-ext-tar-26.2.7.3-

      - name: Build Welfarego OFFICE Windows x64 MSI
        shell: pwsh
        run: .\scripts\build-windows.ps1 -WorkDir C:\lo -CygwinRoot C:\cygwin64

      - name: Upload MSI Installer & MPL-2.0 Source Archive
        uses: actions/upload-artifact@v4
        with:
          name: Welfarego-OFFICE-Windows-x64-MSI
          path: |
            dist/*.msi
            dist/*_MPL2_Source_Patches.zip
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.msi
            dist/*_MPL2_Source_Patches.zip
            dist/SHA256SUMS.txt
          body: |
            ## Welfarego OFFICE (Windows x64 MSI)

            - **Modern Fluent Ribbon UI** enabled by default (Writer, Calc, Impress, Draw)
            - **Sukapura SVG** modern vector icons + Korean (`ko`) & English (`en-US`) UI
            - **Pure MPL-2.0 Subset Build** (`--enable-mpl-subset`): commercial-friendly with zero GPL/LGPL-only modules
            - **MPL-2.0 Source Compliance**: Modified source patches and full license notices are included in `*_MPL2_Source_Patches.zip`
